name: Bergen County cooking classes

on:
  schedule:
    - cron: "52 12 * * 1,4"   # Mon & Thu ~8:52am ET
  workflow_dispatch:

permissions:
  contents: write

concurrency: cooking-classes

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cooking-classes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Find classes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m cooking_classes
      - name: Commit results
        run: |
          git config user.name "cooking-classes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data inbox
          git diff --cached --quiet || git commit -m "Update Bergen County cooking classes"
          git push
      - name: Summary
        run: cat data/latest.md >> "$GITHUB_STEP_SUMMARY"
